name: Container image

# Publishes ghcr.io/sadishihab/fixit-mcp, but ONLY when a version tag (v*) is pushed: an ordinary push or
# pull request never publishes anything. "Run workflow" (workflow_dispatch) builds and smoke-tests the
# image exactly as a release would, for both architectures, and pushes nothing.
#
# The only credential is the built-in GITHUB_TOKEN. No AWS access, no other secrets.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sadishihab/fixit-mcp

jobs:
  # A broken image must never publish: build the amd64 image, start it, and run the same end-to-end
  # smoke checks `make docker-smoke` runs. No AWS variables are set, so this also proves the image
  # works on its defaults (SQLite household store, 0.0.0.0:8000/mcp, non-root).
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the amd64 image (loaded locally, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: fixit-mcp:smoke
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      - name: The image runs as the non-root user and sets no AWS or backend variables
        run: |
          test "$(docker run --rm --entrypoint id fixit-mcp:smoke -u)" = "1000"
          env_json="$(docker image inspect fixit-mcp:smoke --format '{{json .Config.Env}}')"
          echo "image env: ${env_json}"
          if echo "${env_json}" | grep -Eq 'AWS_|FIXIT_REPOSITORY_BACKEND|FIXIT_AGENTCORE'; then
            echo "the image must default to the SQLite backend with no AWS settings" >&2
            exit 1
          fi

      - name: Start the container
        run: docker run -d --name fixit -p 8000:8000 fixit-mcp:smoke

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install the smoke script's dependencies
        run: uv sync --locked --no-dev

      # The latency check is skipped: a shared runner's timing says nothing about the server.
      - name: Smoke checks against the running container
        run: uv run python scripts/smoke_test.py --url http://localhost:8000/mcp --wait 90 --skip-latency

      - name: Container logs (on failure)
        if: failure()
        run: docker logs fixit

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU builds the arm64 image on this x86_64 runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Only a version tag pushes. On a manual run this step is skipped and nothing is published.
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.3.0 -> 0.3.0, 0.3 and latest (a pre-release tag such as v0.3.0-rc1 does not move latest).
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=FixIt MCP
            org.opencontainers.image.description=An MCP server for diagnosing home appliance problems from cited facts extracted from real manuals. For trying FixIt out, not a production deployment.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/sadishihab/fixit-mcp
            org.opencontainers.image.url=https://github.com/sadishihab/fixit-mcp
            org.opencontainers.image.documentation=https://github.com/sadishihab/fixit-mcp#run-it-with-docker-no-aws-account

      - name: Build for amd64 and arm64 (pushes only for a version tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
