# Paraphrase bank for diagnose_symptom's matcher (step 27c).
#
# Every phrasing is invented here (none is manual text). Each case says which stored row the
# customer should be sent to, or `none` when the right answer is not_found: an appliance or
# problem the manuals do not cover, a vague complaint, a safety or cost question.
#
# A row is named by (appliance, page, row): `row` is the 0-based index of the record among the
# records of that manual's page, counted in data/index/symptoms.json order. A symptom that spans
# several rows is named by its first row. `expect` is a list when more than one symptom is a
# correct answer (the matcher must put one of them first).
#
# The bank is evaluated through the tool, for a household that owns both the GE refrigerator and
# the GE washer: a wrong cited answer (a match for a `none` case, or the wrong symptom first) is
# worse than not_found, and `ambiguous_appliance` for a `none` case counts as a wrong match.
#
# known_wrong: a case the matcher still answers wrongly, with the reason. The test allows exactly these and
#   fails if any other wrong answer appears, or if a known-wrong case stops being wrong (remove the flag).
#
# tags: plain | slang | misspelling | short | long | unsupported | offtopic | safety | other-appliance

