[project]
name = "fixit-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sadi", email = "sadi.shihab@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30,<2",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "pyyaml>=6.0.3",
    # Runtime dependency since step 4b: the "agentcore" repository backend
    # (AgentCore Memory) talks to AWS via the bedrock-agentcore data plane.
    "boto3>=1.43.100",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
