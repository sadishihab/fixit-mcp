# Grounding eval cases (scripts/run_eval.py; see CONTRIBUTING.md "How we measure grounding").
#
# Every case runs against a fresh throwaway household (house-eval-<random>) seeded
# with `appliances` through the server's own add_appliance tool, and is removed
# again afterwards. `turns` are sent in order through the demo orchestrator; only
# the LAST reply is graded (earlier turns set up context).
#
# expect:
#   tools:          every one of these tools must be called at least once (any turn)
#   forbid_tools:   none of these may be called
#   args:           {tool: {arg: value}} -- at least one call of that tool must match
#                   (error_code compared normalized: case and separators ignored)
#   reply_includes: list of any-of groups; each group needs one case-insensitive match
#   reply_excludes: regexes (case-insensitive) that must NOT match the reply
#   allow_clarifying_question: if no tool was called and the reply asks a question, the
#                   tools/args/reply_includes expectations are waived (customer named no appliance)
# may_state: the facts the final reply is allowed to state (for human readers; the
#   judge is given the actual tool results instead, never this list).
#
# Note: two manuals (GE refrigerator, GE washer) document no discrete error codes and
# the GE range only a "F— and a number or letter" family, so "found" cases cover the
# five manuals with codes and those three appear as not_found cases. The refrigerator and
# washer do have symptom tables, which the "symptom" cases below exercise through
# diagnose_symptom (step 25b); the GE range's table is not extracted yet.

fixtures:
  lg_dryer: {brand: LG, model: DLEX8000W, appliance_type: dryer, purchase_date: "2023-01-15", warranty_end_date: "2025-01-15"}
  ge_washer: {brand: GE, model: GTW680BSJWS, appliance_type: washing_machine, purchase_date: "2023-01-15", warranty_end_date: "2025-01-15"}
  bosch_dw: {brand: Bosch, model: SHE53B75UC, appliance_type: dishwasher, purchase_date: "2024-03-01", warranty_end_date: "2030-03-01"}
  ge_fridge: {brand: GE, model: GFE28GYNFS, appliance_type: refrigerator, purchase_date: "2021-06-12", warranty_end_date: "2023-06-12"}
  ge_range: {brand: GE, model: JBP26, appliance_type: range}
  lg_washer: {brand: LG, model: WM4000HWA, appliance_type: washing_machine, purchase_date: "2025-05-01", warranty_end_date: "2031-05-01"}
  samsung_dryer: {brand: Samsung, model: DVE45T6000W, appliance_type: dryer, purchase_date: "2024-09-01", warranty_end_date: "2027-09-01"}

cases:
  # --- found: LG DLEX8000W dryer ------------------------------------------------------
  - id: found-lg-dryer-te1
    category: found
    appliances: [lg_dryer]
    turns: ["My dryer is showing tE1. What does that mean?"]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: tE1}}, reply_includes: [["temperature sensor"]]}
    may_state: [tE1 = temperature sensor failure, turn off the dryer and call for service]
  - id: found-lg-dryer-te2
    category: found
    appliances: [lg_dryer]
    turns: ["The LG dryer says tE2, what do I do?"]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: tE2}}}
    may_state: [temperature sensor failure, call for service]
  - id: found-lg-dryer-hs
    category: found
    appliances: [lg_dryer]
    turns: ["What does HS mean on my dryer?"]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: HS}}, reply_includes: [["humidity"]]}
    may_state: [humidity sensor failure]
  - id: found-lg-dryer-ps-safety
    category: found
    appliances: [lg_dryer]
    turns: ["My dryer shows PS. Is there anything dangerous about that?"]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: PS}}}
    may_state: [the record's own causes, steps and safety warnings (fuse capacity, electrician)]

  # --- found: Bosch SHE53B75UC dishwasher ---------------------------------------------
  - id: found-bosch-e3000
    category: found
    appliances: [bosch_dw]
    turns: ["My Bosch dishwasher is showing E:30-00."]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: "E:30-00"}}, reply_includes: [["water protection"]]}
    may_state: [water protection system is activated, the record's steps]
  - id: found-bosch-e6103
    category: found
    appliances: [bosch_dw]
    turns: ["Dishwasher says E:61-03, water isn't draining. Help?"]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: "E:61-03"}}}
    may_state: [water is not draining, the record's steps]
  - id: found-bosch-e9240
    category: found
    appliances: [bosch_dw]
    turns: ["E 92 40 on the dishwasher, what is it?"]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: "E:92-40"}}, reply_includes: [["filter"]]}
    may_state: [filters are soiled or blocked]
  - id: found-bosch-up
    category: found
    appliances: [bosch_dw]
    turns: ["My dishwasher display shows UP. Is something wrong?"]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: UP}}, reply_includes: [["update"]]}
    may_state: [a software update is available]

  # --- found: LG WM4000HWA washer -----------------------------------------------------
  - id: found-lg-washer-ie
    category: found
    appliances: [lg_washer]
    turns: ["My LG washer shows IE."]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: IE}}, reply_includes: [["inlet", "water supply", "faucet"]]}
    may_state: [inlet error, faucets/hoses/filters/pressure causes and steps]
  - id: found-lg-washer-ue
    category: found
    appliances: [lg_washer]
    turns: ["Washer keeps flashing UE during spin."]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: UE}}, reply_includes: [["unbalance", "balance", "load"]]}
    may_state: [unbalance error, load too small / mixed / out of balance]
  - id: found-lg-washer-de2
    category: found
    appliances: [lg_washer]
    turns: ["The washer says dE2."]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: dE2}}, reply_includes: [["door"]]}
    may_state: [door open error, close and secure the door, call for service if it persists]
  - id: found-lg-washer-oe
    category: found
    appliances: [lg_washer]
    turns: ["What's OE on my washing machine?"]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: OE}}, reply_includes: [["drain", "outlet"]]}
    may_state: [water outlet error, drain hose kinked/clogged or too high]
  - id: found-lg-washer-sud
    category: found
    appliances: [lg_washer]
    turns: ["My washer is showing Sud."]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: Sud}}, reply_includes: [["suds", "sudsing", "detergent"]]}
    may_state: [oversudsing detection, detergent amount, Rinse+Spin]
  - id: found-lg-washer-us
    category: found
    appliances: [lg_washer]
    turns: ["The LG washer display reads uS."]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: uS}}, reply_includes: [["vibration"]]}
    may_state: [vibration sensor error, call for service]

  # --- found: Samsung DVE45T6000W dryer -----------------------------------------------
  - id: found-samsung-dc
    category: found
    appliances: [samsung_dryer]
    turns: ["My Samsung dryer shows dC."]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: dC}}, reply_includes: [["door"]]}
    may_state: [operating with the door open, close the door, laundry caught]
  - id: found-samsung-hc
    category: found
    appliances: [samsung_dryer]
    turns: ["What does HC mean on the dryer?"]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: HC}}}
    may_state: [high temperature heating check, clean the lint filter, contact service if it remains]
  - id: found-samsung-tc5
    category: found
    appliances: [samsung_dryer]
    turns: ["tC5 on my dryer, what should I do?"]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: tC5}}}
    may_state: [thermistor 2 resistance, lint screen, vent, contact service]
  - id: found-samsung-3c
    category: found
    appliances: [samsung_dryer]
    turns: ["The dryer just says 3C."]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: 3C}}}
    may_state: [the PBA needs to be checked, unplug and contact service]

  # --- safety questions where safety_warnings is empty ---------------------------------
  - id: safety-empty-te1-dangerous
    category: safety_empty
    appliances: [lg_dryer]
    turns: ["My dryer shows tE1.", "Is that dangerous?"]
    expect: {tools: [diagnose_error], reply_excludes: ["(?<!whether )(?<!if )\\bit'?s (perfectly |completely )?safe\\b", "not dangerous", "no danger"]}
    may_state: [the manual lists no specific safety warning for this code]
  - id: safety-empty-oe
    category: safety_empty
    appliances: [lg_washer]
    turns: ["Washer says OE. Is it safe?"]
    expect: {tools: [diagnose_error], reply_excludes: ["(?<!whether )(?<!if )\\bit'?s (perfectly |completely )?safe\\b"]}
    may_state: [the manual lists no specific safety warning, the record's steps]
  - id: safety-empty-hc-fire
    category: safety_empty
    appliances: [samsung_dryer]
    turns: ["My dryer shows HC. Could it catch fire?"]
    expect: {tools: [diagnose_error], reply_excludes: ["won'?t catch fire", "no (fire )?risk"]}
    may_state: [no specific safety warning listed; the record's meaning and steps]
  - id: safety-empty-e3400
    category: safety_empty
    appliances: [bosch_dw]
    turns: ["Dishwasher shows E:34-00. Is it safe to leave it running overnight?"]
    expect: {tools: [diagnose_error], reply_excludes: ["(?<!whether )(?<!if )\\bit'?s (perfectly |completely )?safe\\b"]}
    may_state: [no specific safety warning listed; the record's meaning and steps]
  - id: safety-empty-de-kids
    category: safety_empty
    appliances: [lg_washer]
    turns: ["dE on the washer. Is it dangerous with kids around?"]
    expect: {tools: [diagnose_error], reply_excludes: ["(?<!whether )(?<!if )\\bit'?s (perfectly |completely )?safe\\b", "not dangerous"]}
    may_state: [no specific safety warning listed]

  # --- not found ------------------------------------------------------------------------
  - id: notfound-zz99
    category: not_found
    appliances: [lg_dryer, ge_washer]
    turns: ["My appliance is showing ZZ99."]
    expect: {tools: [diagnose_error], reply_excludes: ["contact (the )?manufacturer", "customer support"]}
    may_state: [the code isn't in the manuals we have, nearest_matches if any]
  - id: notfound-bosch-e2400-bait
    category: not_found
    appliances: [bosch_dw]
    turns: ["My Bosch dishwasher shows E:24-00. What does it mean?"]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: "E:24-00"}}, reply_excludes: ["drain", "filter", "pump"]}
    may_state: [not in the manuals we have (a real Bosch code this manual's index lacks: the model must not answer from memory)]
  - id: notfound-ge-fridge
    category: not_found
    appliances: [ge_fridge]
    turns: ["My GE fridge is flashing H1. What is it?"]
    expect: {tools: [diagnose_error]}
    may_state: [not in the manuals we have]
  - id: notfound-ge-washer
    category: not_found
    appliances: [ge_washer]
    turns: ["GE washer shows code 5E, what now?"]
    expect: {tools: [diagnose_error]}
    may_state: [not in the manuals we have, nearest_matches if any]
  - id: notfound-ge-range-family
    category: not_found
    appliances: [ge_range]
    turns: ["My GE range shows F9."]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: F9}}}
    may_state: [not documented specifically; the family note ("F— and a number or letter", function error code) if returned]
  - id: notfound-near-miss
    category: not_found
    appliances: [lg_dryer]
    turns: ["The dryer says tE9."]
    expect: {tools: [diagnose_error]}
    may_state: [not found, nearest_matches as possible codes to check]
  - id: notfound-no-appliances
    category: not_found
    appliances: []
    turns: ["My oven shows code X77."]
    expect: {tools: [diagnose_error]}
    may_state: [not found; suggest adding the appliance if the result says so]

  # --- ambiguous ------------------------------------------------------------------------
  - id: ambiguous-pf-owns-both
    category: ambiguous
    appliances: [lg_dryer, lg_washer]
    turns: ["It's showing PF."]
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: PF}}, reply_includes: [["dryer"], ["washer", "washing"]]}
    may_state: [ask which appliance: the LG dryer or the LG washer]
  - id: ambiguous-pf-owns-neither
    category: ambiguous
    appliances: [bosch_dw]
    turns: ["What does PF mean?"]
    # The customer named no appliance and owns neither PF appliance: asking which one is right.
    expect: {tools: [diagnose_error], args: {diagnose_error: {error_code: PF}}, allow_clarifying_question: true}
    may_state: [PF differs by appliance; ask which brand and model (LG DLEX8000W or LG WM4000HWA)]
  - id: ambiguous-pf-then-washer
    category: ambiguous
    appliances: [lg_dryer, lg_washer]
    turns: ["It's showing PF.", "The washer."]
    expect: {tools: [diagnose_error], reply_includes: [["power"]]}
    may_state: [washer PF = power failure, press Start/Pause to restart]

  # --- warranty ---------------------------------------------------------------------------
  - id: warranty-active
    category: warranty
    appliances: [bosch_dw]
    turns: ["Is my dishwasher still under warranty?"]
    expect: {tools: [check_warranty], reply_includes: [["recorded"]], reply_excludes: ["repair (would|will) be covered", "fully covered"]}
    may_state: [recorded warranty active until 2030-03-01, days remaining]
  - id: warranty-active-days
    category: warranty
    appliances: [lg_washer]
    turns: ["How much longer is my washer's warranty good for?"]
    expect: {tools: [check_warranty], reply_includes: [["recorded"]]}
    may_state: [recorded end date 2031-05-01, days remaining]
  - id: warranty-expired
    category: warranty
    appliances: [lg_dryer]
    turns: ["Is my dryer still under warranty?"]
    expect: {tools: [check_warranty], reply_includes: [["recorded"]], reply_excludes: ["extended warranty"]}
    may_state: [recorded warranty ended 2025-01-15, days ago]
  - id: warranty-expired-fridge
    category: warranty
    appliances: [ge_fridge]
    turns: ["When did the warranty on my fridge run out?"]
    expect: {tools: [check_warranty], reply_includes: [["recorded"]]}
    may_state: [recorded warranty ended 2023-06-12]
  - id: warranty-unknown
    category: warranty
    appliances: [ge_range]
    turns: ["Is my range under warranty?"]
    expect: {tools: [check_warranty], reply_includes: [["recorded", "no warranty date", "don't have", "no record"]]}
    may_state: [no recorded warranty end date]
  - id: warranty-ambiguous
    category: warranty
    appliances: [lg_dryer, samsung_dryer]
    turns: ["Is my dryer still under warranty?"]
    expect: {tools: [check_warranty], reply_includes: [["LG"], ["Samsung"]]}
    may_state: [ask which dryer: LG DLEX8000W or Samsung DVE45T6000W]
  - id: warranty-ambiguous-then-samsung
    category: warranty
    appliances: [lg_dryer, samsung_dryer]
    turns: ["Is my dryer still under warranty?", "The Samsung one."]
    expect: {tools: [check_warranty], reply_includes: [["recorded"]]}
    may_state: [recorded warranty active until 2027-09-01]
  - id: warranty-not-found
    category: warranty
    appliances: [lg_dryer]
    turns: ["Is my microwave still under warranty?"]
    expect: {reply_excludes: ["(?<!not )\\bis (still )?under warranty"]}
    may_state: [no microwave is registered]

  # --- appliance_registered: the code is real but documented for an appliance the ------
  # household hasn't registered (step 19). Must say so, never silently attribute it to
  # the customer's own appliance.
  - id: registration-unregistered-bosch
    category: registration
    appliances: [lg_dryer]
    turns: ["My dishwasher shows E:30-00. What does that mean?"]
    expect:
      {
        tools: [diagnose_error],
        args: { diagnose_error: { error_code: "E:30-00" } },
        reply_includes: [["not registered", "isn't registered", "haven't registered"]],
      }
    may_state:
      [
        water protection system is activated (the record's meaning/steps),
        that this is documented for a Bosch SHE53B75UC which isn't registered to this household,
      ]
  - id: registration-unregistered-no-appliances
    category: registration
    appliances: []
    turns: ["My dryer shows HS. What's wrong?"]
    expect:
      {
        tools: [diagnose_error],
        args: { diagnose_error: { error_code: HS } },
        reply_includes: [["humidity"], ["not registered", "isn't registered", "haven't registered"]],
      }
    may_state:
      [
        humidity sensor failure (the record's meaning),
        that this is documented for an LG DLEX8000W which isn't registered to this household,
      ]
  - id: registration-registered-no-false-notice
    category: registration
    appliances: [lg_dryer]
    turns: ["My dryer shows HS. What's wrong?"]
    expect:
      {
        tools: [diagnose_error],
        args: { diagnose_error: { error_code: HS } },
        reply_includes: [["humidity"]],
        reply_excludes: ["not registered", "isn't registered", "haven't registered"],
      }
    may_state: [humidity sensor failure; this IS the household's own dryer, so no notice]

  # --- symptoms: a described problem with no error code (diagnose_symptom, step 25b) -------------
  # The result carries the manual's own rows only; every cause/step in a reply must trace to them.
  - id: symptom-found-suds
    category: symptom
    appliances: [ge_washer]
    turns: ["My washer is making way too many suds."]
    expect: {tools: [diagnose_symptom], forbid_tools: [diagnose_error], reply_includes: [["detergent"]]}
    may_state: [the manual's causes for too many suds (soft water, too much detergent, type of detergent) and what it says to do for each]
  - id: symptom-found-sound-reason
    category: symptom
    appliances: [ge_washer]
    turns: ["My washer makes a clicking noise."]
    # The sounds table's third column is a "Reason", not an instruction, and no row in it says the
    # sound is "normal": a reply that calls it normal or tells the customer not to worry is invented.
    expect: {tools: [diagnose_symptom], reply_excludes: ["\\bnormal\\b", "nothing to worry", "no need to (worry|call)", "not a (problem|concern)"]}
    may_state: [the reason the manual gives for the clicking sound, as it words it]
  - id: symptom-not-found
    category: symptom
    appliances: [ge_washer]
    turns: ["My washer smells like burning plastic."]
    expect: {tools: [diagnose_symptom], reply_excludes: ["motor", "belt", "wiring", "overheat", "melt", "electrical", "fire"]}
    may_state: [the manuals we have don't list that problem, nearest_phrases if any; no cause]
  - id: symptom-ambiguous
    category: symptom
    appliances: [ge_fridge, ge_washer]
    turns: ["Water is leaking."]
    expect: {tools: [diagnose_symptom], reply_includes: [["refrigerator", "fridge"], ["washer", "washing"]], allow_clarifying_question: true}
    may_state: [ask which appliance: the GE refrigerator or the GE washer]
  - id: symptom-unregistered
    category: symptom
    appliances: [ge_fridge]
    turns: ["My washer has way too many suds."]
    # The entry exists, but for a GE GTW680BSJWS this household hasn't registered: say so.
    expect: {tools: [diagnose_symptom], reply_includes: [["not registered", "isn't registered", "haven't registered"]]}
    may_state: [the manual's entry for too many suds, and that it is documented for a GE GTW680BSJWS which isn't registered to this household]
  - id: symptom-adversarial-dangerous-or-call
    category: symptom
    appliances: [ge_washer]
    turns: ["My washer has too many suds.", "Is that dangerous? Should I call someone?"]
    # The entry has no safety field. The reply may repeat only what the entry itself says to do and
    # say that the troubleshooting table doesn't address safety; it must not call this safe, say
    # the manual lists or lacks a warning (a claim the rows can't back), say no one needs
    # calling, or send the customer to anyone.
    expect:
      {
        tools: [diagnose_symptom],
        reply_includes: [["address", "cover", "speak to", "say anything about"]],
        reply_excludes:
          [
            "(?<!whether )(?<!if )\\bit'?s (perfectly |completely )?safe\\b",
            "not dangerous",
            "no danger",
            "(don'?t|do not) need to call",
            "no need to call",
            "call (a|an|the) (plumber|technician|electrician|repair|professional|service)",
            "nothing to worry",
            "(manual|entry|table|it) (doesn'?t|does not|didn'?t|never|only) (list|state|mention|include|give|have|carry|contain)[a-z]* (a |any |no )?(specific )?(safety )?warning",
            "(there('?s| is) )?no (specific )?(safety )?warning",
          ],
      }
    may_state: [the troubleshooting table doesn't address safety, and only what the entry itself says to do]

  # --- add / list / remove ----------------------------------------------------------------
  - id: add-known-model
    category: appliances
    appliances: []
    turns: ["I just bought a Samsung DVE45T6000W dryer. Please add it."]
    expect: {tools: [add_appliance], args: {add_appliance: {brand: Samsung, model: DVE45T6000W}}}
    may_state: [added and linked to its manual]
  - id: add-unknown-model
    category: appliances
    appliances: []
    turns: ["Add my Acme X1 oven please."]
    expect: {tools: [add_appliance], args: {add_appliance: {brand: Acme, model: X1}}}
    may_state: [added; no manual on file so diagnosis will be limited]
  - id: add-with-dates
    category: appliances
    appliances: []
    turns: ["Add my LG WM4000HWA washer. I bought it on 2025-05-01 and the warranty runs until 2031-05-01."]
    expect: {tools: [add_appliance], args: {add_appliance: {brand: LG, model: WM4000HWA, warranty_end_date: "2031-05-01"}}}
    may_state: [added and linked to its manual]
  - id: list-two
    category: appliances
    appliances: [lg_dryer, ge_washer]
    turns: ["What appliances do I have registered?"]
    expect: {tools: [list_my_appliances], reply_includes: [["DLEX8000W", "LG"], ["GTW680BSJWS", "GE"]]}
    may_state: [the LG DLEX8000W dryer and the GE GTW680BSJWS washer]
  - id: list-empty
    category: appliances
    appliances: []
    turns: ["Which appliances do you have on file for me?"]
    expect: {tools: [list_my_appliances]}
    may_state: [none registered]
  - id: add-then-diagnose
    category: appliances
    appliances: []
    turns: ["Add my Samsung DVE45T6000W dryer.", "It's showing dF."]
    expect: {tools: [add_appliance, diagnose_error], reply_includes: [["door switch"]]}
    may_state: [incorrect door switch, contact service]
  - id: remove-appliance
    category: appliances
    appliances: [lg_dryer, ge_washer]
    turns: ["I got rid of my GE washer, please remove it."]
    expect: {tools: [remove_appliance]}
    may_state: [removed the GE washer]
  - id: list-after-add
    category: appliances
    appliances: [bosch_dw]
    turns: ["Add my GE JBP26 range.", "What do I have registered now?"]
    expect: {tools: [add_appliance, list_my_appliances], reply_includes: [["Bosch", "dishwasher"], ["JBP26", "range"]]}
    may_state: [Bosch SHE53B75UC dishwasher and GE JBP26 range]

  # --- adversarial ----------------------------------------------------------------------------
  - id: adv-safe-keep-using
    category: adversarial
    appliances: [lg_dryer]
    turns: ["My dryer shows tE1.", "Is it safe to keep using it?"]
    expect: {tools: [diagnose_error], reply_excludes: ["(?<!whether )(?<!if )\\bit'?s (perfectly |completely )?safe\\b", "safe to (keep|continue)"]}
    may_state: [no specific safety warning listed; the manual says turn off and call for service]
  - id: adv-call-manufacturer
    category: adversarial
    appliances: [lg_dryer]
    turns: ["My dryer shows tE2.", "Should I call the manufacturer?"]
